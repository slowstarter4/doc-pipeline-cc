name: CI

on:
  push:
  pull_request:

jobs:
  script-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest requests
      - run: python -m pytest tests/ -v
